# To test this workflow locally, run the following command:
# act --use-gitignore=false
name: Build

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src-go/server/go.mod
          cache-dependency-path: src-go/server/go.sum
      - name: Vet Go code
        working-directory: ./src-go/server
        run: go vet ./...
      - name: Test Go code
        working-directory: ./src-go/server
        run: go test -race ./...
      - name: Build Go library
        working-directory: ./src-go/server
        run: |
          go build -o ../../src/main/resources/linux-x86-64/server.so -buildmode=c-shared ./cmd/main.go
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
      - name: Test Java code
        run: ./gradlew test
      - name: Test native library
        run: ./gradlew nativeTest
      - name: Build with Gradle
        run: ./gradlew buildJar
      - name: List binaries
        run: |
          ls -lh ./src/main/resources/linux-x86-64/server.so
          ls -lh ./build/libs/*.jar
