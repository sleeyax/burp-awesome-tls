# To test this workflow locally, run the following command:
# act --use-gitignore=false
name: Release binaries

on:
  push:
    tags:
      - 'v*'
jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Execute CGO builds using XGO
        uses: crazy-max/ghaction-xgo@v4
        # docs: https://github.com/marketplace/actions/golang-cgo-cross-compiler#inputs
        with:
          xgo_version: latest
          go_version: 1.24.1
          dest: build
          pkg: cmd
          prefix: server
          targets: windows/386,windows/amd64,linux/386,linux/amd64,linux/arm,linux/arm64,darwin/amd64,darwin/arm64
          # Prints the build commands as compilation progresses (default false)
          x: true
          ldflags: -w
          buildmode: c-shared
          working_dir: ./src-go/server
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
      - name: Build cross-platform jar files
        shell: sh
        run: ./build.sh
      - name: Store jar files
        uses: actions/upload-artifact@v7
        with:
          name: jars
          path: ./build/libs/*.jar
          if-no-files-found: error

  smoke-test:
    name: Smoke test ${{ matrix.jar }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # The 32-bit and linux/arm builds have no hosted runner to load them on.
      matrix:
        include:
          - runner: ubuntu-latest
            jar: linux-amd64
          - runner: ubuntu-24.04-arm
            jar: linux-arm64
          - runner: windows-latest
            jar: windows-amd64
          - runner: macos-latest
            jar: macos-arm64
          - runner: macos-15-intel
            jar: macos-amd64
    steps:
      - uses: actions/checkout@v7
      - name: Download jar files
        uses: actions/download-artifact@v8
        with:
          name: jars
          path: jars
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
      - name: Test platform jar
        shell: bash
        run: ./gradlew nativeTest -PextensionJar=jars/Burp-Awesome-TLS-${{ matrix.jar }}.jar
      - name: Test fat jar
        shell: bash
        run: ./gradlew nativeTest --rerun -PextensionJar=jars/Burp-Awesome-TLS-fat.jar

  release:
    name: Release binaries
    needs: smoke-test
    runs-on: ubuntu-latest
    steps:
      - name: Download jar files
        uses: actions/download-artifact@v8
        with:
          name: jars
          path: jars
      - name: Upload binaries
        uses: xresloader/upload-to-github-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "./jars/*.jar"
          tags: true
